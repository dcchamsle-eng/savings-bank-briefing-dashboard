<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저축은행 브리핑 월간 리포트</title><style>
  :root{
    --ink:#17253A;
    --paper:#FAF9F6;
    --rule:#DBD7CE;
    --dim:#6F7787;
    --flag:#A8761B;
    --flag-soft:#F2E7D0;
    --miss:#E9E6DF;
    --maxw:760px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;
    line-height:1.7;
    font-feature-settings:"tnum" 1;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:40px 20px 72px}

  header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:32px}
  h1{font-size:26px;line-height:1.3;font-weight:700;margin:0 0 6px;letter-spacing:-.02em}
  .period{font-size:15px;color:var(--dim);margin:0}

  /* coverage */
  .cov{margin:0 0 40px}
  .cov h2{font-size:15px;font-weight:600;margin:0 0 4px}
  .cov p.note{font-size:14px;color:var(--dim);margin:0 0 16px}
  .month{margin-bottom:14px}
  .month b{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
  .days{display:flex;flex-wrap:wrap;gap:5px}
  .d{
    width:34px;height:34px;border-radius:3px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;background:var(--miss);color:#A9A499;
    border:1px solid transparent;position:relative;
  }
  .d.on{background:#fff;border-color:var(--rule);color:var(--ink)}
  .d.hit{background:var(--flag-soft);border-color:var(--flag);color:#6E4B0C;font-weight:600}
  .d.fail{background:#fff;border-color:#C0392B;color:#C0392B}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:13px;color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:13px;height:13px;border-radius:3px;border:1px solid transparent;flex:none}

  .stats{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 0;padding-top:16px;border-top:1px solid var(--rule)}
  .stat b{display:block;font-size:24px;font-weight:700;line-height:1.2}
  .stat span{font-size:13px;color:var(--dim)}

  h2.sec{font-size:19px;font-weight:700;margin:44px 0 4px;letter-spacing:-.01em}
  h2.sec + p.lead{font-size:14px;color:var(--dim);margin:0 0 18px}

  .item{border-top:1px solid var(--rule);padding:18px 0}
  .item:last-child{border-bottom:1px solid var(--rule)}
  .item .when{font-size:13px;color:var(--dim);margin:0 0 4px}
  .item h3{font-size:17px;font-weight:650;margin:0 0 6px;line-height:1.45}
  .item p{margin:0 0 8px;font-size:15px}
  .item .src{font-size:13px;color:var(--dim);margin:0}
  .item .src a{color:var(--flag);text-decoration:none;border-bottom:1px solid var(--flag-soft)}
  .item .src a:hover,.item .src a:focus{border-bottom-color:var(--flag)}
  .tag{
    display:inline-block;font-size:12px;padding:1px 7px;border-radius:2px;
    background:var(--flag-soft);color:#6E4B0C;margin-left:6px;vertical-align:2px;font-weight:600;
  }

  ul.plain{margin:0;padding-left:18px;font-size:15px}
  ul.plain li{margin-bottom:6px}

  .status{background:#fff;border:1px solid var(--rule);border-left:3px solid #C0392B;padding:14px 16px;margin:18px 0 0;font-size:14px}
  .status b{display:block;margin-bottom:4px}

  footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--dim)}
  a:focus-visible,.d:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
  @media(max-width:480px){
    .wrap{padding:28px 16px 56px}
    h1{font-size:22px}
    .d{width:calc((100% - 30px)/6);height:32px}
  }

:root{--paper-raised:#f6f5ec;--rule-strong:#b6b29d;--navy:#26456f}
  .hidden { display: none; }

  .gate-overlay {
    position: fixed; inset: 0; background: var(--paper);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .gate-box {
    background: var(--paper-raised); border: 1px solid var(--rule-strong);
    padding: 36px 32px; text-align: center; width: 320px;
  }
  .gate-box h1 { font-size: 16px; margin: 0 0 16px; color: var(--navy); }
  .gate-box input {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--rule-strong);
    margin-bottom: 10px; background: var(--paper);
  }
  .gate-box button {
    width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--navy);
    background: var(--navy); color: white; cursor: pointer;
  }
  .gate-box button:disabled { opacity: 0.6; cursor: default; }
  .gate-error { margin-top: 10px; font-size: 12.5px; color: #973c3c; min-height: 1em; }


.body,.period,.regulatory-note,footer,ul.plain li{white-space:pre-wrap}
</style></head><body><div class="gate-overlay" id="gateOverlay">
  <div class="gate-box">
    <h1>비밀번호를 입력하세요</h1>
    <input type="password" id="gatePassword" placeholder="비밀번호" autocomplete="off" />
    <button id="gateSubmit">확인</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div><div id="wrap" class="wrap hidden"></div>

async function derivePasswordKey(password, saltBytes, iterations) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: saltBytes, iterations, hash: "SHA-256" }, keyMaterial, 256);
  return new Uint8Array(bits);
}

async function hmacSha256(keyBytes, msgBytes) {
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, msgBytes);
  return new Uint8Array(sig);
}

async function expandKeystream(key, saltBytes, length) {
  let out = new Uint8Array(0);
  let counter = 0;
  while (out.length < length) {
    const counterBytes = new Uint8Array(4);
    new DataView(counterBytes.buffer).setUint32(0, counter, false);
    const msg = new Uint8Array(saltBytes.length + 4);
    msg.set(saltBytes, 0);
    msg.set(counterBytes, saltBytes.length);
    const block = await hmacSha256(key, msg);
    const combined = new Uint8Array(out.length + block.length);
    combined.set(out, 0);
    combined.set(block, out.length);
    out = combined;
    counter++;
  }
  return out.slice(0, length);
}

async function tryUnlock(password) {
  const saltBytes = new Uint8Array(ENCRYPTED.salt.match(/.{2}/g).map(b => parseInt(b, 16)));
  const cipherBytes = Uint8Array.from(atob(ENCRYPTED.cipher), c => c.charCodeAt(0));
  const key = await derivePasswordKey(password, saltBytes, ENCRYPTED.iterations);
  const keystream = await expandKeystream(key, saltBytes, cipherBytes.length);
  const plainBytes = cipherBytes.map((b, i) => b ^ keystream[i]);
  const text = new TextDecoder("utf-8", { fatal: true }).decode(plainBytes);
  return JSON.parse(text);
}

function unlock(data) {
  document.getElementById("gateOverlay").remove();
  document.getElementById("wrap").classList.remove("hidden");
  initDashboard(data);
}

const gateSubmit = document.getElementById("gateSubmit");
const gatePassword = document.getElementById("gatePassword");
const gateError = document.getElementById("gateError");

async function attemptUnlock() {
  gateError.textContent = "";
  gateSubmit.disabled = true;
  try {
    const data = await tryUnlock(gatePassword.value);
    sessionStorage.setItem("briefingPw", gatePassword.value);
    unlock(data);
  } catch (e) {
    gateError.textContent = "비밀번호가 틀렸습니다.";
    gateSubmit.disabled = false;
  }
}

gateSubmit.addEventListener("click", attemptUnlock);
gatePassword.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptUnlock(); });

(async () => {
  const saved = sessionStorage.getItem("briefingPw");
  if (saved) {
    try {
      const data = await tryUnlock(saved);
      unlock(data);
      return;
    } catch (e) { /* 저장된 비밀번호가 안 맞으면 다시 입력받는다 */ }
  }
  gatePassword.focus();
})();</script></body></html>
